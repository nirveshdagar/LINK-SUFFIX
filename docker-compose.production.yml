services:
  postgres:
    image: postgres:${TAH_POSTGRES_MAJOR:-16}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tah
      POSTGRES_PASSWORD: ${TAH_POSTGRES_PASSWORD:?set TAH_POSTGRES_PASSWORD}
      POSTGRES_DB: tah
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U tah -d tah
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - private
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    user: "999:1000"
    environment:
      TAH_REDIS_PASSWORD: ${TAH_REDIS_PASSWORD:?set TAH_REDIS_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --maxmemory 384mb --maxmemory-policy noeviction --requirepass "$$TAH_REDIS_PASSWORD"
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$TAH_REDIS_PASSWORD" ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - private
  migrate:
    image: traffic-armour-app:${TAH_IMAGE_TAG:-latest}
    restart: on-failure:5
    command:
      - node
      - tooling/migrate.mjs
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      TAH_DISTRIBUTED_REQUIRED: "1"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - private
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  web:
    build: .
    restart: unless-stopped
    command:
      - /app/node_modules/.bin/next
      - start
      - /app/web
      - --hostname
      - 0.0.0.0
      - --port
      - "3100"
    expose:
      - "3100"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3100/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      TAH_UNIVERSAL_PROXY_ENABLED: "1"
      TAH_DISTRIBUTED_REQUIRED: "1"
      TAH_CONTROL_INTERNAL_URL: http://control:3101
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    volumes:
      - tah_runs:/app/runs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - private
    image: traffic-armour-app:${TAH_IMAGE_TAG:-latest}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      control:
        condition: service_healthy
  control:
    restart: unless-stopped
    command:
      - node
      - web/server/control.mjs
    expose:
      - "3101"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const net=require('node:net');const s=net.connect(3101,'127.0.0.1',()=>{s.end();process.exit(0)});s.setTimeout(3000,()=>process.exit(1));s.on('error',()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      TAH_UNIVERSAL_PROXY_ENABLED: "1"
      TAH_PROXY_RUNTIME_INTERNAL_URL: http://web:3100/api/proxy-runtime
      TAH_DISTRIBUTED_REQUIRED: "1"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    volumes:
      - tah_runs:/app/runs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    shm_size: 2gb
    networks:
      - private
    image: traffic-armour-app:${TAH_IMAGE_TAG:-latest}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    environment:
      TAH_DOMAIN: ${TAH_DOMAIN:?set TAH_DOMAIN}
      TAH_TLS_EMAIL: ${TAH_TLS_EMAIL:?set TAH_TLS_EMAIL}
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      control:
        condition: service_healthy
    networks:
      - private
  metrics-exporter:
    restart: unless-stopped
    command:
      - node
      - tooling/metrics-exporter.mjs
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
    expose:
      - "3198"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - private
    image: traffic-armour-app:${TAH_IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  health-watchdog:
    restart: unless-stopped
    command:
      - node
      - tooling/health-watchdog.mjs
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      TAH_ALERTS_INTERNAL_URL: http://web:3100/api/alerts
      TAH_HEALTH_INTERVAL_MS: "15000"
      TAH_CONTROL_INTERNAL_WS_URL: ws://control:3101
      TAH_CONTROL_RECOVERY_ORIGIN: https://${TAH_DOMAIN}
      TAH_CAMPAIGN_SELF_HEAL_ENABLED: "1"
      TAH_CAMPAIGN_RECOVERY_ALERT_FRESHNESS_MS: "45000"
      TAH_CAMPAIGN_RECOVERY_BASE_COOLDOWN_MS: "120000"
      TAH_CAMPAIGN_RECOVERY_MAX_ATTEMPTS: "4"
      TAH_CAMPAIGN_RECOVERY_WINDOW_MS: "3600000"
    expose:
      - "3197"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3197/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - private
    image: traffic-armour-app:${TAH_IMAGE_TAG:-latest}
    depends_on:
      web:
        condition: service_healthy
      control:
        condition: service_healthy
      postgres:
        condition: service_healthy
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus.production.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts-production.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - control
      - alertmanager
    networks:
      - private
  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - private
  alert-dispatcher:
    restart: unless-stopped
    command:
      - node
      - tooling/alert-dispatcher.mjs
    env_file:
      - path: .env.production
        required: false
    expose:
      - "3199"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - private
    image: traffic-armour-app:${TAH_IMAGE_TAG:-latest}
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
      args:
        POSTGRES_MAJOR: ${TAH_POSTGRES_MAJOR:-16}
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      BACKUP_DIR: /backups
    volumes:
      - postgres_backups:/backups
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - private
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /backups/.last-success && find /backups/.last-success
          -mmin -1560 | grep -q .
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 10m
    depends_on:
      postgres:
        condition: service_healthy
networks:
  private:
    internal: false
volumes:
  caddy_data: null
  caddy_config: null
  prometheus_data: null
  alertmanager_data: null
  tah_runs: {}
  postgres_backups: {}
  postgres_data: {}
  redis_data: {}
