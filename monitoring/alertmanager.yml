global:
  resolve_timeout: 5m

route:
  receiver: operations-webhook
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h

receivers:
  - name: operations-webhook
    webhook_configs:
      - url: http://alert-dispatcher:3199/alerts
        send_resolved: true
