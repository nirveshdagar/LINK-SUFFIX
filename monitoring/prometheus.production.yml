global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: traffic-armour-control
    static_configs:
      - targets: ["control:3101"]
  - job_name: traffic-armour-data-plane
    static_configs:
      - targets: ["metrics-exporter:3198"]
  - job_name: traffic-armour-health-watchdog
    static_configs:
      - targets: ["health-watchdog:3197"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
